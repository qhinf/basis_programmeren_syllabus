            <section>
                <section data-markdown>
                    <textarea data-template>
                        ## Validatie van je invoer
                    </textarea>
                </section>
                <section data-markdown>
                    <textarea data-template>
                        ```python
                        getal = int(input("Voer een getal in: "))
                        ```
                        ```plaintext
                        ValueError: invalid literal for int() with base 10: 'a'
                        ```
                        <!-- .element: class="fragment" -->
                    </textarea>
                </section>
                <section data-markdown>
                    <textarea data-template>
                        ![Flowchart met een lus die om invoer blijft vragen als de invoer niet correct is.](assets/bijeenkomst_6/validatie_flow.png) <!-- .element: class="r-stretch" -->
                    </textarea>
                </section>
                <section data-markdown data-auto-animate data-auto-animate-id="invoer-lus">
                    <textarea data-template>
                        ```python [1-2|3|4-5|1-5]
                        invoerCorrect = False
                        while not invoerCorrect:
                            invoer = input("Voer een getal in: ")
                            if invoer.isdigit():
                                invoerCorrect = True
                        ```
                        <!-- .element: data-id="invoer-lus" -->

                        Notes:
                        - `.isdigit()` is nieuw
                        - Niet heel vriendelijk, geen feedback
                    </textarea>
                </section>
                <section data-markdown data-auto-animate data-auto-animate-id="invoer-lus">
                    <textarea data-template>
                        ```python [6-7]
                        invoerCorrect = False
                        while not invoerCorrect:
                            invoer = input("Voer een getal in: ")
                            if invoer.isdigit():
                                invoerCorrect = True
                            else:
                                print("Dat is geen getal. Probeer opnieuw!")
                        ```
                        <!-- .element: data-id="invoer-lus" -->
                    </textarea>
                </section>
                <section data-markdown data-auto-animate data-auto-animate-id="invoer-lus-func">
                    <textarea data-template>
                        ```python [|1,9]
                        def getalInvoer():
                            invoerCorrect = False
                            while not invoerCorrect:
                                invoer = input("Voer een getal in: ")
                                if invoer.isdigit():
                                    invoerCorrect = True
                                else:
                                    print("Dat is geen getal. Probeer opnieuw!")
                            return int(invoer)
                        ```
                        <!-- .element: data-id="invoer-lus-func" -->
                    </textarea>
                </section>
                <section data-markdown data-auto-animate data-auto-animate-id="invoer-lus-func">
                    <textarea data-template>
                        ```python [11-12|]
                        def getalInvoer():
                            invoerCorrect = False
                            while not invoerCorrect:
                                invoer = input("Voer een getal in: ")
                                if invoer.isdigit():
                                    invoerCorrect = True
                                else:
                                    print("Dat is geen getal. Probeer opnieuw!")
                            return int(invoer)

                        a = getalInvoer()
                        print("Je hebt het getal", a, "ingevoerd")
                        ```
                        <!-- .element: data-id="invoer-lus-func" -->
                    </textarea>
